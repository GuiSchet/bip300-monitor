---
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set}

services:
  ecash-node:
    image: ${ECASH_NODE_IMAGE:?ECASH_NODE_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      BITCOIN_DATA: /data
      GID: ${PGID:-1000}
      UID: ${PUID:-1000}
    command:
      - -conf=/etc/ecash/ecash.conf
      - -port=${ECASH_NODE_P2P_PORT:?ECASH_NODE_P2P_PORT must be set by VERSIONS.lock}
      - -rpcport=${ECASH_NODE_RPC_PORT:?ECASH_NODE_RPC_PORT must be set by VERSIONS.lock}
      - -printtoconsole=1
    volumes:
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/node
        target: /data
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/snapshots
        target: /snapshots
        read_only: true
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/rpc-cookie
        target: /rpc-cookie
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/config/ecash.conf
        target: /etc/ecash/ecash.conf
        read_only: true
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bitcoin-cli -datadir=/data
          -conf=/etc/ecash/ecash.conf
          -rpcport=${ECASH_NODE_RPC_PORT}
          -rpcwait getblockchaininfo >/dev/null
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  enforcer:
    image: ${ENFORCER_IMAGE:?ENFORCER_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: on-failure
    stop_grace_period: 2m
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      HOME: /data
      RUST_LOG: ${ENFORCER_RUST_LOG:-info}
    command:
      - --data-dir=/data
      - --network-preset=${ENFORCER_NETWORK_PRESET:?ENFORCER_NETWORK_PRESET must be set by VERSIONS.lock}
      - --node-rpc-addr=ecash-node:${ECASH_NODE_RPC_PORT}
      - --node-rpc-cookie-path=/rpc-cookie/.cookie
      - --node-zmq-addr-sequence=tcp://ecash-node:${ECASH_NODE_ZMQ_PORT}
      - --node-blocks-dir=/node-blocks
      - --serve-grpc-addr=0.0.0.0:50051
      - --bitcoin-core-expected-version=${ECASH_NODE_EXPECTED_VERSION:?ECASH_NODE_EXPECTED_VERSION must be set by VERSIONS.lock}
      - --log-level=INFO
    volumes:
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/enforcer
        target: /data
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/rpc-cookie
        target: /rpc-cookie
        read_only: true
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/node/blocks
        target: /node-blocks
        read_only: true
    depends_on:
      ecash-node:
        condition: service_healthy
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 10
          --request POST --header 'Content-Type: application/json'
          --data '{}'
          http://127.0.0.1:50051/cusf.mainchain.v1.ValidatorService/GetChainTip
          >/dev/null
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  nats:
    image: ${NATS_IMAGE:?NATS_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: on-failure
    stop_grace_period: 30s
    user: 10002:10002
    command:
      - nats-server
      - --name=${COMPOSE_PROJECT_NAME}
      - --port=4222
      - --http_port=8222
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:8222/healthz
          | grep -q '"status":"ok"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: on-failure
    stop_grace_period: 1m
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set by VERSIONS.lock}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set by VERSIONS.lock}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      # Set explicitly so the cluster lives inside the bind mount regardless of
      # where the image would otherwise place it.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/secrets/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=127.0.0.1
          --username=${POSTGRES_USER} --dbname=${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  event-logger:
    image: ${EVENT_LOGGER_IMAGE:?EVENT_LOGGER_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: on-failure
    stop_grace_period: 20s
    user: 10001:10001
    environment:
      BIP300_MONITOR_NATS_URL: nats://nats:4222
      BIP300_MONITOR_LOG_LEVEL: ${BIP300_MONITOR_LOG_LEVEL:-info}
      BIP300_MONITOR_FULL_EVENTS: ${BIP300_MONITOR_FULL_EVENTS:-true}
      BIP300_MONITOR_NATS_FLUSH_TIMEOUT_SECONDS: "10"
      BIP300_MONITOR_SHUTDOWN_TIMEOUT_SECONDS: "15"
      BIP300_MONITOR_LIVENESS_FILE: /tmp/liveness
      BIP300_MONITOR_LIVENESS_INTERVAL_SECONDS: "30"
    depends_on:
      nats:
        condition: service_healthy
    # A quiet chain delivers nothing, so there is no message to wait for: the
    # logger round-trips NATS on its own interval and refreshes the file only
    # when that succeeds. The staleness bound is three intervals, so one slow
    # round-trip is not an outage.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/liveness) )) -lt 90 ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      ecash-internal:
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  enforcer-extractor:
    image: ${ENFORCER_EXTRACTOR_IMAGE:?ENFORCER_EXTRACTOR_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: on-failure
    stop_grace_period: 20s
    # Its own UID, but PGID as the group so it can read the group-readable
    # Postgres password without sharing an identity with any other service.
    user: 10001:${PGID:-1000}
    volumes:
      - type: bind
        source: ${ECASH_DATA_ROOT:?ECASH_DATA_ROOT must be derived from NETWORK_ID}/secrets/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
    environment:
      BIP300_MONITOR_NATS_URL: nats://nats:4222
      BIP300_MONITOR_POSTGRES_HOST: postgres
      BIP300_MONITOR_POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set by VERSIONS.lock}
      BIP300_MONITOR_POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set by VERSIONS.lock}
      BIP300_MONITOR_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      BIP300_MONITOR_ENFORCER_ENDPOINT: http://enforcer:50051
      BIP300_MONITOR_SIDECHAINS: ${BIP300_MONITOR_SIDECHAINS:-9,98}
      BIP300_MONITOR_LOG_LEVEL: ${BIP300_MONITOR_LOG_LEVEL:-info}
      BIP300_MONITOR_REQUEST_TIMEOUT_SECONDS: "10"
      BIP300_MONITOR_NATS_FLUSH_TIMEOUT_SECONDS: "10"
      BIP300_MONITOR_SHUTDOWN_TIMEOUT_SECONDS: "15"
      # How much history one restart may recover. Past this the extractor
      # records a window ending at the tip and warns that the rest was skipped,
      # so raising it is how a long outage is closed rather than dropped.
      BIP300_MONITOR_BACKFILL_MAX_BLOCKS: ${BIP300_MONITOR_BACKFILL_MAX_BLOCKS:-2000}
      BIP300_MONITOR_TIP_POLL_INTERVAL_SECONDS: "30"
      BIP300_MONITOR_LIVENESS_FILE: /tmp/liveness
    depends_on:
      enforcer:
        condition: service_healthy
      # This only orders container startup. Use `just monitor-up` so the logger
      # subscription is confirmed before the extractor publishes its snapshot.
      event-logger:
        condition: service_started
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The extractor exposes no port, so the tip poll is what proves it is alive:
    # it refreshes this file only after the enforcer answers. A restart policy
    # alone would leave a running-but-wedged extractor in place.
    # The staleness bound is three poll intervals, so one slow answer is not an
    # outage.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/liveness) )) -lt 90 ]
      interval: 30s
      timeout: 5s
      retries: 3
      # The snapshot and the backfill both run before the first tip poll.
      start_period: 180s
    networks:
      ecash-internal:
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

networks:
  ecash-internal:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set}-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
