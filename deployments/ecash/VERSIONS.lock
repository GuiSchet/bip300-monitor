# shellcheck shell=bash
# Reproducible eCash network, image, tool, and snapshot lock.
LOCK_FORMAT=2
LOCKED_AT=2026-08-27

NETWORK_ID=alphanet
ECASH_NODE_CHAIN=main
# Descriptive only: no RPC exposes the wire magic, so nothing here can assert
# it. Network identity is proven by require_activation_block (exact block hash
# at the fork height) plus require_node_peer, which only succeeds when the
# node's compiled-in magic matches its peers.
ECASH_NETWORK_MAGIC=eca5a104
ECASH_NODE_P2P_PORT=8533
ECASH_NODE_RPC_PORT=8532
ECASH_NODE_ZMQ_PORT=29000
ECASH_PUBLIC_PEERS=seed.alpha.ecash.ninja:8533,seed.alpha.bip300.xyz:8533,seed.alpha.ecash.drivecha.in:8533,seed.alpha.ecash.zuexeuz.net:8533
ECASH_TIP_HEIGHT_URL=https://esplora.alpha.ecash.ninja/blocks/tip/height
ECASH_EXPECTED_DATA_BYTES=1200000000000
ECASH_MIN_FREE_PERCENT=20

# Third-party images are pinned to the multi-architecture index digest, which
# is what `docker pull <tag>` reports. The monitor images below have no index:
# this repository's CI builds linux/amd64 only, so their tag resolves straight
# to a single manifest. preflight.sh checks that every pin resolves to
# linux/amd64 rather than to another platform's child.
ECASH_NODE_REPO=https://github.com/ecash-com/bitcoin.git
ECASH_NODE_BRANCH=alphanet
ECASH_NODE_COMMIT=e9267a1f88f1856789348a61f04718529e1bd063
ECASH_NODE_IMAGE=ghcr.io/ecash-com/bitcoin:alphanet@sha256:22698f3306b4b6658a64beb33c506442b2385aae8b7fb786986ac1c5e8843304
ECASH_NODE_EXPECTED_VERSION=31

ENFORCER_REPO=https://github.com/LayerTwo-Labs/bip300301_enforcer.git
ENFORCER_BRANCH=master
ENFORCER_COMMIT=b6601add8cd7361f064d38196ee0bd32c7bd5f4b
ENFORCER_IMAGE=ghcr.io/layertwo-labs/bip300301_enforcer:sha-b6601ad@sha256:fc6880a0ca14c401fd1ba5d4e1c8e1c240ddf218d3797f669c0b69de97619294
ENFORCER_NETWORK_PRESET=alphanet
ENFORCER_API_NETWORK=NETWORK_MAINNET

NATS_IMAGE=docker.io/library/nats:2.14.3-alpine@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0

# Postgres is the authoritative record. NATS stays as best-effort live fan-out,
# so losing a message there costs nothing once the row is committed.
POSTGRES_IMAGE=docker.io/library/postgres:18.2-alpine@sha256:035b9ab53cfa147d7202b61f5f7782b939ae815b7d6bc81c96b7b42ff1fca950
POSTGRES_DB=bip300_monitor
POSTGRES_USER=bip300_monitor

MONITOR_IMAGE_COMMIT=5d85b5b4d0d3d1ae8509a290430b920f2506f018
ENFORCER_EXTRACTOR_IMAGE=docker.io/guischet/bip300-enforcer-extractor:sha-5d85b5b4d0d3@sha256:ace3d2a57e8f742c440c0565fbcc8e5d1a07f3c659aba0a9e83f2dd62fb71a3d
EVENT_LOGGER_IMAGE=docker.io/guischet/bip300-event-logger:sha-5d85b5b4d0d3@sha256:543605f376f1ce1222fe07ac6820843848a38877215b3efc066c3b7d81ae79b2

JUST_VERSION=1.57.0
JUST_TARGET=x86_64-unknown-linux-musl
JUST_SHA256=45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155

ECASH_ACTIVATION_HEIGHT=963648
ECASH_ACTIVATION_BLOCK_HASH=0000000000b360c17636b7a6c366e3effbe91a847eb5d61b7a7b29476439e924
ECASH_SNAPSHOT_URL=https://data.drivechain.dev/alphanet/utxo-963648.dat
ECASH_SNAPSHOT_CHECKSUMS_URL=https://data.drivechain.dev/alphanet/SHA256SUMS
ECASH_SNAPSHOT_FILE=utxo-963648.dat
ECASH_SNAPSHOT_SIZE=9468026932
ECASH_SNAPSHOT_SHA256=ca4ea635bfd26fbfeb2fa38cc38298ce916b61a9411e4926fe248292d0b1fd31
