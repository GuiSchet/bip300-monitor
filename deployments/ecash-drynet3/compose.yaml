---
name: ${COMPOSE_PROJECT_NAME:-bip300-ecash-drynet3}

services:
  ecash-node:
    image: ${ECASH_NODE_IMAGE:?ECASH_NODE_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      BITCOIN_DATA: /data
      GID: ${PGID:-1000}
      UID: ${PUID:-1000}
    command:
      - -conf=/etc/ecash/drivechain-ecash.conf
      - -printtoconsole=1
    volumes:
      - type: bind
        source: ${ECASH_DATA_ROOT:-./data}/node
        target: /data
      - type: bind
        source: ${ECASH_DATA_ROOT:-./data}/snapshots
        target: /snapshots
        read_only: true
      - type: bind
        source: ${ECASH_DATA_ROOT:-./data}/rpc-cookie
        target: /rpc-cookie
      - type: bind
        source: ./config/drynet3/drivechain-ecash.conf
        target: /etc/ecash/drivechain-ecash.conf
        read_only: true
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bitcoin-cli -datadir=/data
          -conf=/etc/ecash/drivechain-ecash.conf
          -rpcwait getblockchaininfo >/dev/null
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  enforcer:
    image: ${ENFORCER_IMAGE:?ENFORCER_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      HOME: /data
      RUST_LOG: ${ENFORCER_RUST_LOG:-info}
    command:
      - --data-dir=/data
      - --network-preset=drynet3
      - --node-rpc-addr=ecash-node:8332
      - --node-rpc-cookie-path=/rpc-cookie/.cookie
      - --node-zmq-addr-sequence=tcp://ecash-node:29000
      - --node-blocks-dir=/node-blocks
      - --serve-grpc-addr=0.0.0.0:50051
      - --bitcoin-core-expected-version=31
      - --log-level=INFO
    volumes:
      - type: bind
        source: ${ECASH_DATA_ROOT:-./data}/enforcer
        target: /data
      - type: bind
        source: ${ECASH_DATA_ROOT:-./data}/rpc-cookie
        target: /rpc-cookie
        read_only: true
      - type: bind
        source: ${ECASH_DATA_ROOT:-./data}/node/blocks
        target: /node-blocks
        read_only: true
    depends_on:
      ecash-node:
        condition: service_healthy
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 10
          --request POST --header 'Content-Type: application/json'
          --data '{}'
          http://127.0.0.1:50051/cusf.mainchain.v1.ValidatorService/GetChainTip
          >/dev/null
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  nats:
    image: ${NATS_IMAGE:?NATS_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: 10002:10002
    command:
      - nats-server
      - --name=bip300-ecash-drynet3
      - --port=4222
      - --http_port=8222
    networks:
      ecash-internal:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:8222/healthz
          | grep -q '"status":"ok"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  event-logger:
    image: ${EVENT_LOGGER_IMAGE:?EVENT_LOGGER_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    user: 10001:10001
    environment:
      BIP300_MONITOR_NATS_URL: nats://nats:4222
      BIP300_MONITOR_LOG_LEVEL: ${BIP300_MONITOR_LOG_LEVEL:-info}
      BIP300_MONITOR_FULL_EVENTS: ${BIP300_MONITOR_FULL_EVENTS:-true}
      BIP300_MONITOR_NATS_FLUSH_TIMEOUT_SECONDS: "10"
      BIP300_MONITOR_SHUTDOWN_TIMEOUT_SECONDS: "15"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      ecash-internal:
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

  enforcer-extractor:
    image: ${ENFORCER_EXTRACTOR_IMAGE:?ENFORCER_EXTRACTOR_IMAGE must be set by VERSIONS.lock}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    user: 10001:10001
    environment:
      BIP300_MONITOR_NATS_URL: nats://nats:4222
      BIP300_MONITOR_ENFORCER_ENDPOINT: http://enforcer:50051
      BIP300_MONITOR_SIDECHAINS: ${BIP300_MONITOR_SIDECHAINS:-9,98}
      BIP300_MONITOR_LOG_LEVEL: ${BIP300_MONITOR_LOG_LEVEL:-info}
      BIP300_MONITOR_REQUEST_TIMEOUT_SECONDS: "10"
      BIP300_MONITOR_NATS_FLUSH_TIMEOUT_SECONDS: "10"
      BIP300_MONITOR_SHUTDOWN_TIMEOUT_SECONDS: "15"
    depends_on:
      enforcer:
        condition: service_healthy
      event-logger:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      ecash-internal:
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m

networks:
  ecash-internal:
    name: ${COMPOSE_PROJECT_NAME:-bip300-ecash-drynet3}-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
