# eCash Drynet3 only. It deliberately does not accept inbound peers because
# the drynets share Bitcoin mainnet's network magic.
server=1
listen=0
discover=0
dnsseed=0
connect=drynet3.drivechain.dev:8337

rest=1
txindex=1
disablewallet=1

rpcport=8332
rpcbind=0.0.0.0
rpcallowip=172.30.0.0/24
rpccookiefile=/data/.cookie
rpcthreads=8

zmqpubsequence=tcp://0.0.0.0:29000
printtoconsole=1
