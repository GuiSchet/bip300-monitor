[workspace]
resolver = "2"
members = [
    "extractors/enforcer",
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/GuiSchet/bip300-monitor"

[workspace.dependencies]
anyhow = "1.0.102"
async-nats = { version = "0.50.0", default-features = false }
clap = { version = "4.6.0", features = ["derive", "env"] }
futures-util = "0.3.31"
hex = "0.4.3"
prost = "0.14.1"
prost-build = "0.14.1"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14.2", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
