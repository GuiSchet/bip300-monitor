name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-features --jobs 2 --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --jobs 2 --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --jobs 2 --locked
