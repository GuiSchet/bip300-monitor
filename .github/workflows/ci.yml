name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  DOCKER_METADATA_SHORT_SHA_LENGTH: "12"

# The workflow first classifies the changed files, then runs only the relevant
# jobs. This keeps deployment-only PRs from rebuilding or publishing the Rust
# container images. `ci-result` is the single stable check for branch protection.
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Rust sources, Cargo metadata, or protobuf definitions changed.
      rust: ${{ steps.changes.outputs.rust }}
      # Files that affect the contents of a published container image changed.
      image_inputs: ${{ steps.changes.outputs.image_inputs }}
      # Files below deployments/ changed.
      deployment: ${{ steps.changes.outputs.deployment }}
      # This workflow or its helper scripts changed, so all checks should run.
      workflow: ${{ steps.changes.outputs.workflow }}
      # Vendored proto files or their provenance metadata changed.
      proto_vendor: ${{ steps.changes.outputs.proto_vendor }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Manual runs and release tags intentionally exercise every check.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] \
            || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            {
              echo "rust=true"
              echo "image_inputs=true"
              echo "deployment=true"
              echo "workflow=true"
              echo "proto_vendor=true"
            } >> "${GITHUB_OUTPUT}"
          # For a PR, compare the complete branch with its target branch.
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" \
              | .github/scripts/classify-changes.sh
          # For a push to main, inspect only the commits included in that push.
          elif [[ -n "${BEFORE_SHA}" ]] \
            && [[ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" \
              | .github/scripts/classify-changes.sh
          # New refs do not have a usable previous SHA, so classify all files.
          else
            git ls-files | .github/scripts/classify-changes.sh
          fi

  # Run the expensive Rust suite when code, image inputs, or CI behavior
  # changed -- and also on a deployment-only change, because the deployment
  # checks assert things about the binaries: `static-check.sh` pins the
  # extractor's environment variables and `verify-live.sh` matches its log
  # lines. Skipping the Rust suite there let a rename break the deployment with
  # both CI paths green.
  quality:
    name: Rust quality checks
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.image_inputs == 'true'
      || needs.changes.outputs.deployment == 'true'
      || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The record integration tests need a real server; pinned by digest like
    # every other image the project runs.
    services:
      postgres:
        image: postgres:18.2-alpine@sha256:035b9ab53cfa147d7202b61f5f7782b939ae815b7d6bc81c96b7b42ff1fca950
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            nats-server

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Verify the pinned toolchain matches the build image
        run: |
          set -euo pipefail

          channel="$(grep -oE '^channel = "[0-9]+\.[0-9]+\.[0-9]+"' \
            rust-toolchain.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          image="$(grep -oE '^ARG RUST_IMAGE=rust:[0-9]+\.[0-9]+\.[0-9]+' \
            Dockerfile | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"

          if [[ -z "${channel}" ]] || [[ -z "${image}" ]]; then
            echo "::error::could not read the toolchain channel or the RUST_IMAGE tag"
            exit 1
          fi

          if [[ "${channel}" != "${image}" ]]; then
            echo "::error::rust-toolchain.toml pins ${channel} but the Dockerfile builds with rust:${image}"
            exit 1
          fi

          echo "Toolchain ${channel} matches the Dockerfile build image."

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-features --jobs 2 --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --jobs 2 --locked -- -D warnings

      - name: Test workspace
        env:
          BIP300_MONITOR_TEST_POSTGRES_URL: >-
            host=127.0.0.1 port=55432 user=postgres password=test dbname=postgres
        run: cargo test --workspace --all-features --jobs 2 --locked

  # Build both final images and smoke-test their contents. Pull requests never
  # publish; a merge to main publishes only when an actual image input changed.
  images:
    name: Container image (${{ matrix.target }})
    needs:
      - changes
      - quality
    if: >-
      needs.changes.outputs.image_inputs == 'true'
      || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: enforcer-extractor
            image: guischet/bip300-enforcer-extractor
            absent_binary: event-logger
          - target: event-logger
            image: guischet/bip300-event-logger
            absent_binary: enforcer-extractor

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          # main identifies the default branch, sha-* is immutable, and
          # semantic/latest tags are reserved for explicit vX.Y.Z releases.
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

      # Secrets are unavailable to PRs. Workflow-only and deployment-only
      # merges also skip login because they must not publish new images.
      - name: Log in to Docker Hub
        if: >-
          github.event_name == 'push'
          && (
            startsWith(github.ref, 'refs/tags/v')
            || (
              github.ref == 'refs/heads/main'
              && needs.changes.outputs.image_inputs == 'true'
            )
          )
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: guischet
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            CARGO_BUILD_JOBS=2
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both targets share the `builder` stage, which compiles both binaries.
          # A per-target scope would keep two copies of identical layers.
          cache-from: type=gha,scope=workspace-builder
          cache-to: type=gha,mode=max,scope=workspace-builder
          load: true
          push: false
          provenance: false
          sbom: false

      - name: Smoke test image
        env:
          IMAGE_REF: ${{ matrix.image }}:${{ steps.meta.outputs.version }}
        run: >-
          scripts/container-smoke.sh
          "${IMAGE_REF}"
          "${{ matrix.target }}"
          "${{ matrix.absent_binary }}"

      - name: Publish image
        if: >-
          github.event_name == 'push'
          && (
            startsWith(github.ref, 'refs/tags/v')
            || (
              github.ref == 'refs/heads/main'
              && needs.changes.outputs.image_inputs == 'true'
            )
          )
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            CARGO_BUILD_JOBS=2
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=workspace-builder
          push: true
          # Keep a single image manifest until Docker Hub indexes attached attestations.
          provenance: false
          sbom: false

  # The vendored enforcer API must track the enforcer commit the deployment
  # pins. Proto metadata is not a Rust or image input, but this gate still has
  # to validate it independently from deployment changes.
  proto-vendor:
    name: Vendored proto check
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.deployment == 'true'
      || needs.changes.outputs.workflow == 'true'
      || needs.changes.outputs.proto_vendor == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the vendored enforcer API
        run: ./.github/scripts/check-proto-vendor.sh --online

  # Deployment checks live under deployments/ecash. Keeping the
  # job separate means infrastructure PRs remain fast and cannot publish code.
  deployment:
    name: Deployment checks
    needs: changes
    if: >-
      needs.changes.outputs.deployment == 'true'
      || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deployment check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq \
            shellcheck \
            shfmt \
            yamllint

      - name: Install pinned just
        working-directory: deployments/ecash
        env:
          JUST_INSTALL_DIR: ${{ runner.temp }}/just/bin
        run: |
          ./scripts/install-just.sh "${JUST_INSTALL_DIR}"
          echo "${JUST_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Reject tracked deployment secrets
        run: |
          set -euo pipefail

          if git ls-files 'deployments/**/.env' | grep -q .; then
            echo "::error::deployment .env files must not be committed"
            exit 1
          fi

          echo "No tracked deployment .env files found."

      - name: Validate eCash deployment
        working-directory: deployments/ecash
        run: ./scripts/static-check.sh

  # Other jobs may be intentionally skipped, which makes their individual
  # check names unstable. This always-running aggregate is the required PR check.
  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - quality
      - images
      - proto-vendor
      - deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require successful checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          PROTO_VENDOR_RESULT: ${{ needs.proto-vendor.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: |
          set -euo pipefail

          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "::error::change detection finished with ${CHANGES_RESULT}"
            exit 1
          fi

          for result in \
            "${QUALITY_RESULT}" \
            "${IMAGES_RESULT}" \
            "${PROTO_VENDOR_RESULT}" \
            "${DEPLOYMENT_RESULT}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "::error::a required CI job finished with ${result}"
              exit 1
            fi
          done

          echo "All required CI jobs passed or were intentionally skipped."
