syntax = "proto3";

package enforcer_extractor;

// A normalized event produced from the enforcer's read-only validator API.
message EnforcerEvent {
  // 9 moved to the node envelope. 10 and 13 were fork-only (contract <= 8):
  // the official enforcer exposes neither per-block BIP300 deltas nor fees.
  reserved 9, 10, 13;
  reserved "mainchain_block", "bip300_block_delta", "confirmed_bmm_fees";

  oneof event {
    ChainInfo chain_info = 1;
    ChainTip chain_tip = 2;
    SidechainProposalsSnapshot sidechain_proposals = 3;
    ActiveSidechainsSnapshot active_sidechains = 4;
    CtipSnapshot ctip = 5;
    BlockConnected block_connected = 6;
    BlockDisconnected block_disconnected = 7;
    WithdrawalBundleProposalsSnapshot withdrawal_bundle_proposals = 8;
    BmmRequestsSnapshot bmm_requests = 11;
    MainchainTransition mainchain_transition = 12;
  }
}

enum Network {
  NETWORK_UNSPECIFIED = 0;
  NETWORK_UNKNOWN = 1;
  NETWORK_MAINNET = 2;
  NETWORK_REGTEST = 3;
  NETWORK_SIGNET = 4;
  NETWORK_TESTNET = 5;
}

message Bip300Constants {
  uint32 withdrawal_bundle_max_age = 1;
  uint32 withdrawal_bundle_inclusion_threshold = 2;
  uint32 used_sidechain_slot_proposal_max_age = 3;
  uint32 used_sidechain_slot_activation_threshold = 4;
  uint32 unused_sidechain_slot_proposal_max_age = 5;
  uint32 unused_sidechain_slot_activation_threshold = 6;
  uint32 activation_height = 7;
}

message ChainInfo {
  Network network = 1;
  Bip300Constants bip300_constants = 2;
  // Exact protobuf enum number reported upstream, including future values.
  int32 raw_network = 3;
}

message BlockHeader {
  // 32-byte block hash in conventional display order.
  bytes hash = 1;
  // 32-byte previous block hash in conventional display order.
  bytes previous_hash = 2;
  uint32 height = 3;
  // v6 field 4 incorrectly contained per-block work. Never reuse it.
  reserved 4;
  reserved "chain_work";
  // Proof contributed by this block, uint256 little-endian.
  bytes block_work = 6;
  // Absolute accumulated proof from genesis, uint256 little-endian.
  // Empty for official enforcer headers; only the node supplies this evidence.
  bytes cumulative_work = 7;
  // Block timestamp in seconds since the Unix epoch.
  uint64 timestamp = 5;
}

message ChainTip {
  BlockHeader header = 1;
}

// A point-in-time sample of the enforcer's unconfirmed BMM auction. This is
// not a complete transaction history: requests may enter and leave between
// polls. The envelope is anchored to the same parent block recorded here.
message BmmRequestsSnapshot {
  // Fork-only readiness fields; upstream exposes neither.
  reserved 3, 4;
  reserved "observer_session", "mempool_generation";
  // 32-byte parent block hash in conventional display order.
  bytes previous_mainchain_block_hash = 1;
  repeated BmmRequest requests = 2;
}

message BmmRequest {
  uint32 sidechain_number = 1;
  // 32-byte transaction ID in conventional display order.
  bytes txid = 2;
  // Consensus-encoded h* bytes.
  bytes critical_hash = 3;
  uint64 bid_sats = 4;
}

message SidechainDeclaration {
  oneof declaration {
    SidechainDeclarationV0 v0 = 1;
  }
}

message SidechainDeclarationV0 {
  string title = 1;
  string description = 2;
  // Consensus-encoded bytes as returned by the enforcer.
  bytes hash_id_1 = 3;
  // Raw bytes as returned by the enforcer.
  bytes hash_id_2 = 4;
}

message SidechainProposal {
  uint32 sidechain_number = 1;
  // Consensus-encoded proposal bytes as returned by the enforcer.
  bytes raw_description = 2;
  // 32-byte SHA256d hash in conventional display order.
  bytes description_hash = 3;
  uint32 vote_count = 4;
  uint32 proposal_height = 5;
  uint32 proposal_age = 6;
  // Absent when the proposal version is unknown to the enforcer.
  SidechainDeclaration declaration = 7;
}

message SidechainProposalsSnapshot {
  repeated SidechainProposal proposals = 1;
}

message ActiveSidechain {
  uint32 sidechain_number = 1;
  // Consensus-encoded proposal bytes as returned by the enforcer.
  bytes raw_description = 2;
  uint32 vote_count = 3;
  uint32 proposal_height = 4;
  uint32 activation_height = 5;
  // Absent when the proposal version is unknown to the enforcer.
  SidechainDeclaration declaration = 6;
  // 32-byte BIP300 SHA256d description hash in conventional display order.
  bytes description_hash = 7;
}

message ActiveSidechainsSnapshot {
  repeated ActiveSidechain sidechains = 1;
}

message Ctip {
  // 32-byte transaction ID in conventional display order.
  bytes txid = 1;
  uint32 vout = 2;
  uint64 value_sats = 3;
  uint64 sequence_number = 4;
}

message CtipSnapshot {
  uint32 sidechain_number = 1;
  // Absence is meaningful: the sidechain currently has no CTIP.
  Ctip ctip = 2;
}

message OutPoint {
  // 32-byte transaction ID in conventional display order.
  bytes txid = 1;
  uint32 vout = 2;
}

message Deposit {
  uint64 sequence_number = 1;
  OutPoint outpoint = 2;
  // Raw sidechain address bytes, without a consensus length prefix.
  bytes address = 3;
  uint64 value_sats = 4;
}

message WithdrawalBundleEvent {
  // 32-byte M6 identifier (the bundle txid) in conventional display order.
  bytes m6id = 1;

  oneof state {
    WithdrawalBundleSubmitted submitted = 2;
    WithdrawalBundleFailed failed = 3;
    WithdrawalBundleSucceeded succeeded = 4;
  }
}

message WithdrawalBundleSubmitted {}

message WithdrawalBundleFailed {}

message WithdrawalBundleSucceeded {
  uint64 sequence_number = 1;
  // Consensus-encoded transaction bytes as returned by the enforcer.
  bytes transaction = 2;
}

message SidechainEvent {
  oneof event {
    Deposit deposit = 1;
    WithdrawalBundleEvent withdrawal_bundle = 2;
  }
}

// A withdrawal bundle that has been proposed and is still being voted on.
message WithdrawalBundleProposal {
  // 32-byte M6 identifier (the bundle txid) in conventional display order.
  bytes m6id = 1;
  // Accumulated M4 upvotes, to be read against
  // `Bip300Constants.withdrawal_bundle_inclusion_threshold`.
  uint32 vote_count = 2;
  // Mainchain height of the M3 that proposed the bundle. Its distance to the
  // current tip is the bundle age, bounded by
  // `Bip300Constants.withdrawal_bundle_max_age`.
  uint32 proposal_height = 3;
}

message WithdrawalBundleProposalsSnapshot {
  uint32 sidechain_number = 1;
  repeated WithdrawalBundleProposal proposals = 2;
}

message BlockConnected {
  BlockHeader header = 1;
  uint32 sidechain_number = 2;
  // Consensus-encoded BMM h* bytes as returned by the enforcer.
  optional bytes bmm_commitment = 3;
  repeated SidechainEvent events = 4;
}

message BlockDisconnected {
  // 32-byte disconnected block hash in conventional display order.
  bytes block_hash = 1;
  uint32 sidechain_number = 2;
}

// A global mainchain transition seen on the official event stream. Capture
// order belongs to event_observation; upstream provides no durable sequence.
message MainchainTransition {
  // Fork-only server sequence fields.
  reserved 1, 2;
  reserved "observer_session", "sequence";
  // 1 = connected, 2 = disconnected, 3 = subscription boundary.
  //
  // A boundary is written whenever the subscription (re)starts. Upstream does
  // not replay events, so transitions between `gap_start` and `header` are
  // unknown: they are a gap in this stream, not an absence of transitions.
  int32 action = 3;
  // Connected/disconnected block, or the tip read when a boundary began.
  BlockHeader header = 4;
  // Boundary only: the last tip known before the gap. Absent for the very
  // first subscription of a dataset, whose evidence simply starts here.
  optional BlockHeader gap_start = 5;
}

// Node enrichment for a confirmed block: fees of BMM bids that the official
// API showed and that match an official commitment. Never changes the block.
message ConfirmedBmmFees {
  BlockHeader header = 1;
  repeated ConfirmedBmmFee fees = 2;
  string source = 3;
}
message ConfirmedBmmFee {
  uint32 sidechain_number = 1;
  bytes txid = 2;
  optional uint64 fee_sats = 3;
  // Empty when fee_sats is known; otherwise explains missing historical data.
  string unavailable_reason = 4;
}
